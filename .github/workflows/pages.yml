name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A6A21A: ${{ secrets.A6A21A }}
          BBFF64: ${{ secrets.BBFF64 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A6A21A', '')
          sec_b = os.environ.get('BBFF64', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- dbb9c07ffb5c3a3fc1b892e22361 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- fb8a04102010d10f -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
